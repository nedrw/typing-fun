[package]
name = "typing-fun-ui"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[dependencies]
leptos = { version = "0.8", features = ["csr"] }
wasm-bindgen = "0.2"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Window", "Storage", "KeyboardEvent", "EventTarget", "HtmlInputElement", "HtmlElement", "HtmlTextAreaElement", "InputEvent", "CompositionEvent", "FileReader", "File", "FileList", "Blob"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
console_error_panic_hook = "0.1.7"

[workspace]
members = ["src-tauri"]
