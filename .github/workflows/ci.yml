name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  # 纯逻辑测试与静态检查：不需要系统 WebView 依赖
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - name: 安装 Linux 系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf \
            build-essential curl wget file libxdo-dev libssl-dev \
            libayatana-appindicator3-dev

      - run: cargo fmt --check
      - run: cargo clippy -p typing-fun-ui --all-targets
      - run: cargo test -p typing-fun-ui
      - run: cargo check -p typing-fun-ui --target wasm32-unknown-unknown

  # 三个平台的安装包构建；推 tag（v*）时由 tauri-action 建草稿 release
  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          # Intel Mac 需要 macos-13；想在 Apple Silicon 上本地构建则用 macos-latest
          - platform: macos-latest
            target: aarch64-apple-darwin
            bundles: dmg
          - platform: macos-13
            target: x86_64-apple-darwin
            bundles: dmg
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: deb,rpm,appimage
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis,msi
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown,${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2

      - name: 安装 Linux 系统依赖
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf \
            build-essential curl wget file libxdo-dev libssl-dev \
            libayatana-appindicator3-dev

      - name: 安装 trunk 与 tauri-cli（rust-cache 会缓存二进制）
        run: cargo install --locked trunk tauri-cli

      - name: 构建安装包
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tauriScript: cargo tauri
          args: --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}
          tagName: ${{ startsWith(github.ref, 'refs/tags/v') && 'v__VERSION__' || '' }}
          releaseName: "TT 打字训练 v__VERSION__"
          releaseDraft: true
          prerelease: false

      # 非 tag 推送 / PR：把安装包作为构建产物传上去，方便手动下载验证
      - name: 上传构建产物
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v4
        with:
          name: bundles-${{ matrix.platform }}
          path: target/**/release/bundle/**
          if-no-files-found: error
