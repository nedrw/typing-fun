name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  # 纯逻辑测试与静态检查：只编译 UI crate，不需要系统 WebView 依赖
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - run: cargo fmt --check
      - run: cargo clippy -p typing-fun-ui --all-targets
      - run: cargo test -p typing-fun-ui
      - run: cargo check -p typing-fun-ui --target wasm32-unknown-unknown

  # 三平台安装包；只在推 tag（v*）或手动触发时构建，日常 push 只跑 test
  build:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # Apple Silicon 原生构建
          - platform: macos-latest
            target: aarch64-apple-darwin
            bundles: dmg
          # Intel 版由 arm64 runner 交叉编译（macos-13 已退役）
          - platform: macos-latest
            target: x86_64-apple-darwin
            bundles: dmg
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: deb,rpm,appimage
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis,msi
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown,${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2

      # Tauri v2 官方依赖列表：不要再用 libappindicator3-dev（与 ayatana 冲突）
      - name: 安装 Linux 系统依赖
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            patchelf build-essential curl wget file libxdo-dev libssl-dev

      - name: 安装 trunk 与 tauri-cli（优先预编译二进制）
        uses: taiki-e/install-action@v2
        with:
          tool: trunk,tauri-cli

      - name: 构建安装包
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tauriScript: cargo tauri
          args: --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}
          tagName: ${{ startsWith(github.ref, 'refs/tags/v') && 'v__VERSION__' || '' }}
          releaseName: "打字训练 v__VERSION__"
          releaseDraft: true
          prerelease: false

      # 非 tag 推送 / PR：把安装包作为构建产物传上去，方便手动下载验证
      - name: 上传构建产物
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v4
        with:
          name: bundles-${{ matrix.platform }}-${{ matrix.target }}
          path: target/**/release/bundle/**
          if-no-files-found: error
